name: scorecard
# OpenSSF Scorecard: supply-chain checks, results published to the public Scorecard API and to code scanning.
# Action SHAs checked against the GitHub API on 10 Oct 2026.
on:
  branch_protection_rule:
  push: { branches: [main] }
  schedule:
    - cron: '41 5 * * 2'
permissions: { contents: read }
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results: sign the results for the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: { sarif_file: results.sarif }
