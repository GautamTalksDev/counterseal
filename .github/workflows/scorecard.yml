name: scorecard
# OpenSSF Scorecard: supply-chain checks, results published to the public Scorecard API and to code scanning.
# Action SHAs checked against the GitHub API on 10 Oct 2026.
on:
  branch_protection_rule:
  push: { branches: [main] }
  schedule:
    - cron: '41 5 * * 2'
permissions: { contents: read }
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results: sign the results for the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: { sarif_file: results.sarif }
