name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Server, SDK and CLI tests
        run: cd server && node --test test/*.test.js ../sdk/*.test.mjs ../cli/test/*.test.mjs
      - name: CLI and SDK parse
        run: for f in cli/*.mjs sdk/*.mjs scripts/*.mjs plugins/*/scripts/*.mjs action/deploy-gate/*.mjs; do node --check "$f"; done
      - name: Site scripts parse
        run: find site/public -name '*.js' -not -path '*/fonts/*' -print0 | xargs -0 -n1 node --check
      - name: Site copies of the SDK are current
        run: tail -n +2 sdk/receipts.mjs | diff - site/public/receipts-sdk.js && diff sdk/websig.mjs site/public/websig.js && diff sdk/shellmap.mjs site/public/shellmap.js && for f in mcp-policy mcp-sql mcp-json; do diff cli/$f.mjs site/public/mcp/$f.mjs; done
      - name: Guard copies are current (shell map SQL block and API map from the server, CLI copy, plugin scripts)
        run: node scripts/sync-guard.mjs --check
      - name: Brand in step (server/src/brand.js)
        run: node scripts/rebrand.mjs --check
      - name: Install lines name one CLI package (BRAND.cliInstall)
        run: node scripts/cli-name.mjs --check && node --check packages/leashcli/leash.mjs
      - name: CycloneDX SBOM of the CLI (npm sbom; the release attaches it, see publish.yml)
        run: |
          node scripts/sbom-lock.mjs cli && cd cli
          npm sbom --sbom-format cyclonedx --sbom-type application --package-lock-only > ../counterseal.cdx.json && rm package-lock.json
          node -e "const b=require('../counterseal.cdx.json'); if (b.bomFormat!=='CycloneDX'||(b.components||[]).length) process.exit(1); console.log('SBOM', b.specVersion, b.metadata.component.purl)"
      - name: Receipts CLI refuses to pass without verifying
        run: if node sdk/receipts.mjs; then exit 1; fi
      - name: No em or en dashes in user-facing text
        run: |
          if grep -rnP "[\x{2013}\x{2014}]" site/public README.md SECURITY.md docs cli/*.mjs cli/test scripts sdk/shellmap.mjs sdk/shellmap.test.mjs sdk/shellmap.vectors.txt plugins .claude-plugin action --include=*.yml --include=*.html --include=*.js --include=*.md --include=*.mjs --include=*.css --include=*.webmanifest --include=*.json --include=*.txt | grep -v 'receipts-sdk.js' | grep -v "DASH = "; then echo "Use a period, colon or comma instead."; exit 1; fi
      - name: No innerHTML (Trusted Types)
        run: |
          if grep -rnE "\.(innerHTML|outerHTML)\s*=|insertAdjacentHTML\(|document\.write\(" site/public --include=*.js; then exit 1; fi
  fuzz:
    # property-based fuzzing (fast-check, pinned by fuzz/package-lock.json) of the shell map, the MCP policy and the
    # strict JSON and form readers; nothing in fuzz/ ships
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Fuzz the readers
        run: cd fuzz && npm ci --ignore-scripts --no-audit --no-fund && FUZZ_RUNS=20000 npm test
